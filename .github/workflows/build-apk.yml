name: Build NIFLHEIM Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIFLHEIM-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: NIFLHEIM Mobile APK v1.0.0
          body: |
            ### 📱 NIFLHEIM — Aplicativo Nativo Android (.apk)
            
            Baixe e instale diretamente no seu celular para ter:
            - 🔔 **Notificações e Pop-ups Nativos**: Alertas de fim de descanso mesmo com o celular bloqueado ou tela apagada.
            - 📳 **Vibração Tátil de Alta Resposta**: Confirmação física de séries e recordes pessoais (PRs).
            - ⏰ **Lembretes Diários Inteligentes**: Lembrete matinal do treino do dia e avaliação noturna de recuperação (sono/fadiga).
            - ⚡ **Dark Minimalist Fullscreen**: Interface imersiva sem barras de navegador.
            
            **Como instalar:**
            1. Baixe o arquivo `app-debug.apk` abaixo no seu smartphone Android.
            2. Toque no arquivo baixado e permita a instalação.
            3. Abra o NIFLHEIM com suporte completo a notificações e pop-ups!
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
